name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual retry, e.g. after a one-off publish failure

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags and GitHub releases
  pull-requests: write # "Version Packages" PR
  id-token: write # npm trusted publishing and the Azure login for the VS Code Marketplace

jobs:
  release:
    runs-on: ubuntu-latest
    # The Entra ID credential for the Marketplace login is bound to this environment.
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - id: before
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@typemf/core@$version" version > /dev/null 2>&1; then
            echo "on-npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-npm=false" >> "$GITHUB_OUTPUT"
          fi

      # With pending changesets: opens or updates the "Version Packages" PR.
      # Without: publishes every package whose version is not on npm yet.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until trusted publishing is configured for every package on npmjs.com.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - id: release-check
        env:
          VERSION: ${{ steps.before.outputs.version }}
          ON_NPM: ${{ steps.before.outputs.on-npm }}
        run: |
          published=false
          if [ "$ON_NPM" = "false" ]; then
            for attempt in $(seq 1 12); do
              if npm view "@typemf/core@$VERSION" version > /dev/null 2>&1; then
                published=true
                break
              fi
              sleep 5
            done
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # the identity needs no Azure subscription

      - name: Publish extensions
        if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for extension in vscode-runtime-extension instance-editor; do
            vsix="$PWD/$extension.vsix"
            (cd "packages/$extension" && pnpm exec vsce package --no-dependencies --out "$vsix")
            pnpm exec vsce publish --azure-credential --packagePath "$vsix" --skip-duplicate
            pnpm exec ovsx publish "$vsix" --skip-duplicate
          done

      - if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: '*.vsix'
