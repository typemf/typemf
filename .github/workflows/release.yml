name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual retry, e.g. after a one-off publish failure

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags and GitHub releases
  pull-requests: write # "Version Packages" PR
  id-token: write # npm trusted publishing and the Azure login for the VS Code Marketplace

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The registry version of one representative package, read before publishing, so the step
      # below can tell whether a release actually happened. changesets/action@v1's own `published`
      # output can't be trusted for this: it detects a publish by scanning stdout for the text
      # "New tag: ...", which @changesets/cli's current, spinner-based publish output never prints
      # - the fix for that (reading a structured output file instead) only landed in the action's
      # still-unreleased v2. @typemf/core is published whenever any package is (all 8 share one
      # version via the `fixed` setting in .changeset/config.json).
      - id: before
        run: echo "core-version=$(npm view @typemf/core version 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      # With pending changesets: opens or updates the "Version Packages" PR.
      # Without: publishes every package whose version is not on npm yet.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until trusted publishing is configured for every package on npmjs.com.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - id: after
        run: echo "core-version=$(npm view @typemf/core version 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - id: release-check
        run: |
          if [ "${{ steps.before.outputs.core-version }}" != "${{ steps.after.outputs.core-version }}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # vsce authenticates with Microsoft Entra ID: the login below gives it the credentials, so no
      # Marketplace token is stored. The identity must be a member of the publisher.
      - name: Log in to Azure
        if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true # the identity needs no Azure subscription

      # The extensions are private packages: changesets versions them but doesn't publish them.
      # The runtime goes first because the instance editor depends on it. Also runs on a manual
      # workflow_dispatch, as a retry path when a previous run published npm but not the extensions.
      # Open VSX has no Entra ID login, so it keeps its token.
      - name: Publish extensions
        if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for extension in vscode-runtime-extension instance-editor; do
            vsix="$PWD/$extension.vsix"
            (cd "packages/$extension" && pnpm exec vsce package --no-dependencies --out "$vsix")
            pnpm exec vsce publish --azure-credential --packagePath "$vsix" --skip-duplicate
            pnpm exec ovsx publish "$vsix" --skip-duplicate
          done

      - if: steps.release-check.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: '*.vsix'
